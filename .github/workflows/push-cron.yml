# Manuellt anrop av push-cronen (Actions → "Push cron" → Run workflow).
#
# Schemat är BORTTAGET med flit (2026-10-17). GitHub kör schemalagda jobb
# "best effort": i praktiken var 4–6:e timme och ibland inte på ett dygn, så
# nästan alla användare fick sitt tips vid Vercels 19-körning. Timanropen ligger
# nu i vercel.json (en daglig post per timme 06–21 UTC). Två schemalagda källor
# samtidigt hade dessutom kunnat krocka i samma timme.
#
# Kräver repo-hemligheten CRON_SECRET (samma värde som i Vercel).
name: Push cron (manual)

on:
  workflow_dispatch:

permissions: {}

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call daily-recs cron
        run: |
          curl -fsS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.nextwatch.se/api/cron/daily-recs
