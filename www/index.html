<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>NextWatch</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #ededed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      .dot {
        width: 38px;
        height: 38px;
        border-radius: 9999px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #22d3ee;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 20px;
        margin: 0;
        font-weight: 600;
      }
      p {
        margin: 0;
        opacity: 0.7;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!--
      Fallback-skal för Capacitor. Appen laddar normalt server.url
      (https://www.nextwatch.se). Den här sidan syns bara om servern
      inte kan nås.
    -->
    <div class="wrap">
      <div class="dot"></div>
      <h1>NextWatch</h1>
      <p>Laddar…</p>
    </div>
  </body>
</html>
